dependencies = ["fastapi>=0.127,<1", "pydantic>=2.12,<3", "uvicorn>=0.40,<1", "netflix-ml"]
[tool.uv.sources]
netflix-ml = { workspace = true }
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
